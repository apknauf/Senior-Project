# ---- Server ----
server.port=8080

# ---- MySQL connection ----
# Create the database first: CREATE DATABASE workout_db;
spring.datasource.url=jdbc:mysql://localhost:3306/workout_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# 'update' will auto-create/alter tables from the entities on startup.
# Switch to 'validate' or 'none' once your schema is stable, and manage
# migrations with a tool like Flyway/Liquibase in a real production app.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
